name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate bundled JavaScript
        run: |
          python3 - <<'PY'
          import re
          p='app/src/main/assets/index.html'
          h=open(p,encoding='utf-8').read()
          scripts=re.findall(r'<script>(.*?)</script>',h,re.S)
          assert scripts, 'No application script found'
          open('/tmp/iirw-app.js','w',encoding='utf-8').write('\n'.join(scripts))
          print('Extracted',len(scripts),'script block(s)')
          PY
          node --check /tmp/iirw-app.js
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IIRW-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
